name: 'Installs node, yarn and node modules.'
description: 'Installs node, yarn and node modules. Caches node modules.'
inputs:
  cache-prefix:
    description: 'A prefix you can use to prevent cache collisions in incompatible environments'
    required: false
    default: 'cache'
  token:
    description: 'Optional GitHub token (eg. PAT)'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Set up NodeJS environment
      id: setup-node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.tool-versions'

    - name: Cache node_modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: node-modules-cache
      with:
        path: |
          ${{ inputs.working-directory }}/node_modules
        key: |
          ${{ inputs.cache-prefix }}-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('yarn.lock', '.github/actions/setup-node-env/action.yml') }}
        restore-keys: |
          ${{ inputs.cache-prefix }}-node${{ steps.setup-node.outputs.node-version }}-

    - name: Install npm packages
      if: steps.node-modules-cache.outputs.cache-hit != 'true'
      run: yarn install --immutable
      shell: bash
